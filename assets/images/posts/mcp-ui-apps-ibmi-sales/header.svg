<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">One business application, everywhere</title>
  <desc id="description">A conceptual diagram of a standalone web app and AI assistant connecting through MCP Apps to shared business tools and IBM i data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a36"/>
      <stop offset="1" stop-color="#182b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51d9c2"/>
      <stop offset="1" stop-color="#79a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071022" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1085" cy="96" r="190" fill="#377c92" opacity=".12"/>
  <circle cx="103" cy="580" r="220" fill="#7556c7" opacity=".1"/>
  <path d="M0 447C190 400 300 520 480 473s315-123 720-62v219H0Z" fill="#0b142a" opacity=".35"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="85" fill="#8de4d2" font-size="16" font-weight="700" letter-spacing="2.5">A NEW ARCHITECTURE FOR BUSINESS SOFTWARE</text>
    <text x="72" y="165" fill="#f5f8ff" font-size="57" font-weight="750" letter-spacing="-1.7">One business app.</text>
    <text x="72" y="229" fill="#f5f8ff" font-size="57" font-weight="750" letter-spacing="-1.7">Everywhere.</text>
    <text x="75" y="270" fill="#b9c7df" font-size="21">MCP Apps connect a shared workspace to the places users choose.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="327" width="260" height="155" rx="18" fill="#202f4b" stroke="#526783"/>
      <rect x="72" y="327" width="260" height="31" rx="18" fill="#2b3d5d"/>
      <circle cx="94" cy="343" r="4" fill="#ff7b79"/>
      <circle cx="109" cy="343" r="4" fill="#ffce68"/>
      <circle cx="124" cy="343" r="4" fill="#5cdbb7"/>
      <rect x="91" y="375" width="43" height="84" rx="9" fill="#2c4163"/>
      <rect x="149" y="378" width="149" height="11" rx="5.5" fill="#f2f6ff" opacity=".88"/>
      <rect x="149" y="400" width="112" height="8" rx="4" fill="#9cacc5" opacity=".7"/>
      <rect x="149" y="423" width="66" height="29" rx="7" fill="#2fae9d" opacity=".9"/>
      <rect x="224" y="423" width="74" height="29" rx="7" fill="#5475b1" opacity=".85"/>
      <text x="91" y="507" fill="#d8e2f4" font-size="17" font-weight="650">Standalone web app</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="867" y="327" width="260" height="155" rx="18" fill="#202f4b" stroke="#526783"/>
      <rect x="888" y="353" width="219" height="56" rx="15" fill="#2d4566"/>
      <path d="M908 378h118" stroke="#c9d6eb" stroke-width="8" stroke-linecap="round"/>
      <path d="M1010 409v9l14-9" fill="#2d4566"/>
      <rect x="888" y="430" width="177" height="34" rx="12" fill="#324766"/>
      <path d="M907 447h130" stroke="#aabbd4" stroke-width="7" stroke-linecap="round"/>
      <text x="888" y="507" fill="#d8e2f4" font-size="17" font-weight="650">AI assistant / Copilot</text>
    </g>

    <g>
      <path d="M342 399h142" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="m474 390 12 9-12 9" fill="none" stroke="#79dccc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M714 399h142" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
      <path d="m846 390 12 9-12 9" fill="none" stroke="#79dccc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="482" y="343" width="235" height="113" rx="22" fill="#14243d" stroke="#59d7c4" stroke-width="2"/>
      <rect x="504" y="367" width="40" height="40" rx="12" fill="#1d685f"/>
      <path d="m514 380 10-7 10 7v14h-20Z" fill="none" stroke="#9af1dc" stroke-width="2"/>
      <path d="M518 394v-8h12v8" fill="none" stroke="#9af1dc" stroke-width="2"/>
      <text x="556" y="383" fill="#f1f7ff" font-size="20" font-weight="700">MCP Apps</text>
      <text x="556" y="407" fill="#afc1dc" font-size="14">UI + business tools</text>
      <path d="M530 456v26" stroke="#6acfc0" stroke-width="2" stroke-dasharray="4 5"/>
      <text x="516" y="510" fill="#9fc4da" font-size="15" font-weight="600">Shared capability layer</text>
    </g>

    <g transform="translate(553 526)">
      <ellipse cx="83" cy="12" rx="70" ry="14" fill="#2b4d68" stroke="#85c6d0" stroke-width="2"/>
      <path d="M13 12v43c0 8 31 15 70 15s70-7 70-15V12" fill="#213d5a" stroke="#85c6d0" stroke-width="2"/>
      <path d="M13 32c0 8 31 15 70 15s70-7 70-15" fill="none" stroke="#85c6d0" stroke-width="2"/>
      <ellipse cx="83" cy="12" rx="58" ry="8" fill="#357a89" opacity=".8"/>
      <text x="83" y="98" fill="#d3e1f5" font-size="15" font-weight="650" text-anchor="middle">IBM i data</text>
    </g>

    <text x="72" y="592" fill="#879bb8" font-size="14">Natural language and voice depend on the capabilities of the host.</text>
    <text x="1127" y="592" fill="#879bb8" font-size="13" text-anchor="end">CONCEPTUAL ILLUSTRATION</text>
  </g>
</svg>
